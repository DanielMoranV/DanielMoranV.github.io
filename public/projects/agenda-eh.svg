<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agenda EH">
  <title>Agenda EH</title>

  <!-- Los cuatro cuadrantes de la matriz de Eisenhower.
       Version de icono: sin las etiquetas Hacer / Decidir / Delegar / Eliminar,
       que a este tamano no se leerian. -->
  <rect x="14"  y="14"  width="230" height="230" rx="30" fill="#C0392B"/>
  <rect x="268" y="14"  width="230" height="230" rx="30" fill="#4A7EBC"/>
  <rect x="14"  y="268" width="230" height="230" rx="30" fill="#F0A020"/>
  <rect x="268" y="268" width="230" height="230" rx="30" fill="#9DA0A3"/>

  <g fill="#1B2A4A">
    <!-- La cruz que separa urgente de importante -->
    <rect x="237" y="4"   width="38" height="504" rx="6"/>
    <rect x="4"   y="237" width="504" height="38" rx="6"/>

    <!-- Monograma EH, a ambos lados del eje vertical.
         Trazado con formas para no depender de ninguna fuente. -->
    <!-- E -->
    <rect x="150" y="170" width="32" height="172"/>
    <rect x="150" y="170" width="86" height="32"/>
    <rect x="150" y="240" width="72" height="32"/>
    <rect x="150" y="310" width="86" height="32"/>
    <!-- H -->
    <rect x="290" y="170" width="32" height="172"/>
    <rect x="368" y="170" width="32" height="172"/>
    <rect x="290" y="240" width="110" height="32"/>
  </g>
</svg>
