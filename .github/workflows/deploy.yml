name: Deploy to GitHub Pages

# Requiere que Pages este configurado con Source = GitHub Actions.
# Con el ajuste antiguo (Deploy from a branch) este workflow se ejecuta pero
# no publica nada: Pages seguiria sirviendo el contenido crudo de main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar el que ya esta en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Mayores fijadas a proposito. Las anteriores (checkout@v4, setup-node@v4,
      # upload-pages-artifact@v3) apuntaban a Node 20, ya deprecado, y GitHub
      # las estaba forzando a Node 24 con un aviso en cada ejecucion. Al
      # comprobar los cambios de estas versiones no hay ninguno de ruptura para
      # este workflow: son subidas del runtime y de dependencias.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
